server:
  port: 8083
  error:
    include-message: always

spring:
  application:
    name: inbound-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/wms_inbound}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 10
      pool-name: inbound-pool

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Never switch this to update/create.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [cid=%X{correlationId:-}] %-5level %logger{36} - %msg%n"
  level:
    com.company.wms.inbound: DEBUG
