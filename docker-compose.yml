services:
  postgres:
    image: postgres:16-alpine
    container_name: wms-location-bin-db
    environment:
      POSTGRES_DB: wms_location_bin
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - location_bin_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wms_location_bin"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  location_bin_pgdata:
